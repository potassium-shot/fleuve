[package]
name = "client"
version = "0.1.0"
authors = ["Toni Zana <tonizana.dev@gmail.com>"]
edition = "2024"

[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
serde = { version = "1.0.229", features = ["derive"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
